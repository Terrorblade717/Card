<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TON Arena</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .stats {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            background: #2a2a2a;
            color: white;
        }
        .btn:hover:not(:disabled) {
            background: #3a3a3a;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #log {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
        }

        /* Стили для поля боя */
        .hero-card {
            background: #2a2a2a;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            text-align: center;
            position: relative;
            transition: transform 0.2s;
            overflow: hidden;
        }
        .hero-card.enemy {
            border-color: #f44336;
        }
        .hp-bar {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            height: 10px;
            background: rgba(80, 0, 0, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #e53935, #ff5252);
            border-radius: 8px;
            transition: width 0.3s;
        }
        #battleScene {
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .battle-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        #teamA,
        #teamB {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 16px;
            flex-wrap: nowrap;
        }
        #teamA::before,
        #teamB::before {
            content: attr(data-label);
            position: absolute;
            margin-top: -24px;
            font-size: 14px;
            opacity: 0.8;
        }
        #teamA, #teamB {
            position: relative;
            padding-top: 20px;
        }
        .hero-card {
            min-width: 240px;
            max-width: 240px;
        }
        .role-block { background:#1c1c1c; border:1px solid #333; border-radius:12px; padding:12px; margin-bottom:10px; }
        .role-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .pick-grid { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
        .pick-card {
            width: 180px;
            background:#242424;
            border:1px solid #3a3a3a;
            border-radius:10px;
            overflow:hidden;
            cursor:pointer;
        }
        .pick-card img { width:100%; height:180px; object-fit:cover; display:block; }
        .pick-card .meta { padding:8px; font-size:12px; }
        .pick-card.active { border-color:#4CAF50; box-shadow:0 0 12px rgba(76,175,80,.5); }

        @media (max-width: 1280px) {
            .hero-card {
                min-width: 18.5vw;
                max-width: 18.5vw;
            }
        }
        #battleLog {
            margin-top: 15px;
            min-height: 60px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        .battle-controls {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .skip-btn {
            width: auto;
            min-width: 180px;
            background: #8e24aa;
            color: #fff;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            padding: 10px 14px;
            cursor: pointer;
        }
        .damage-popup {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
            animation: floatUp 1s forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; top: -20px; }
            100% { opacity: 0; top: -60px; }
        }
        .skill-flash {
            animation: skillFlash 0.6s ease-in-out;
        }
        @keyframes skillFlash {
            0% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
            50% { box-shadow: 0 0 18px rgba(255, 255, 255, 0.9); }
            100% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ TON Arena</h1>
        
        <div class="stats" id="stats">
            Загрузка...
        </div>

        <div id="primaryActions">
            <button class="btn" onclick="showDeckBuilder()">🃏 Собрать колоду</button>
            <button class="btn" onclick="startBattle()" id="battleBtn" disabled>⚔️ В бой</button>
            <button class="btn" onclick="showRating()">📊 Рейтинг</button>
            <button class="btn" onclick="showShop()">💎 Магазин</button>
        </div>

        <!-- Поле боя (скрыто по умолчанию) -->
        <div id="battleScene">
            <div class="battle-field">
                <div id="teamB" data-label="Вражеская команда"></div>
                <div style="font-size:24px; color:#4CAF50;">⚔️</div>
                <div id="teamA" data-label="Моя команда"></div>
            </div>
            <div id="battleLog"></div>
            <div class="battle-controls">
                <button id="skipBattleBtn" class="skip-btn" onclick="skipBattleAnimation()">⏩ Пропустить бой</button>
            </div>
        </div>

        <div id="content"></div>
        <div id="log"></div>
    </div>

    <script>
        // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
        let isAnimating = false;
        let skipBattleRequested = false;
        let pendingBattleTimeout = null;

        // === НАСТРОЙКИ ===
        const API_URL = '';
        const FAKE_USER_ID = '123456789';

        let userData = null;
        let currentDeck = {};

        // Герои по ролям
        const HEROES_BY_ROLE = {
            "Tank": ["Bulwark", "Sentinel", "Ironbound", "Shieldbearer", "Warden"],
            "Fighter": ["Vanguard", "Skirmisher", "Duelist", "Breaker", "Ravager"],
            "DPS": ["Striker", "Blade", "Lurker", "Marksman", "Reaper"],
            "Mage": ["Arcanist", "Hexer", "Channeler", "Summoner", "Voidcaster"],
            "Support": ["Medic", "Enhancer", "Protector", "Oracle", "Harmonist"]
        };

        // Статы героев (max_hp)
        const HERO_STATS = {
            "Bulwark": 90, "Sentinel": 80, "Ironbound": 85, "Shieldbearer": 82, "Warden": 135,
            "Vanguard": 65, "Skirmisher": 60, "Duelist": 58, "Breaker": 62, "Ravager": 65,
            "Striker": 50, "Blade": 50, "Lurker": 48, "Marksman": 52, "Reaper": 50,
            "Arcanist": 50, "Hexer": 52, "Channeler": 55, "Summoner": 50, "Voidcaster": 50,
            "Medic": 60, "Enhancer": 55, "Protector": 60, "Oracle": 52, "Harmonist": 58
        };

        const SKILL_FX = {
            taunt: { color: '#ffd54f' },
            armor_aura: { color: '#42a5f5' },
            reduce_enemy_damage: { color: '#ef5350' },
            barrier: { color: '#81c784' },
            thorns: { color: '#26c6da' },
            line_pressure: { color: '#ff8a65' },
            scaling: { color: '#ffb74d' },
            debuff: { color: '#ab47bc' },
            dot: { color: '#ef9a9a' },
            silence: { color: '#90a4ae' },
            aoe: { color: '#f06292' },
            heal: { color: '#66bb6a' },
            buff: { color: '#aed581' },
            immortal: { color: '#b39ddb' },
            stun: { color: '#4db6ac' },
            aoe_stun: { color: '#4dd0e1' }
        };

        // === КАРКАС ДЛЯ БУДУЩИХ АССЕТОВ ===
        const ASSET_PATHS = {
            heroes: '/assets/heroes',
            icons: '/assets/ui/icons',
            backgrounds: '/assets/backgrounds',
            skillVideos: '/assets/video/skills',
            hitVideos: '/assets/video/hits'
        };

        const MENU_ICONS = {
            deck: `${ASSET_PATHS.icons}/deck.svg`,
            battle: `${ASSET_PATHS.icons}/battle.svg`,
            rating: `${ASSET_PATHS.icons}/rating.svg`,
            shop: `${ASSET_PATHS.icons}/shop.svg`
        };

        const HERO_ABILITIES = {
            Bulwark: 'Провокация (таунт) и высокий запас брони.',
            Sentinel: 'Повышает броню союзных героев.',
            Ironbound: 'Снижает урон вражеской команды.',
            Shieldbearer: 'Даёт барьер на здоровье.',
            Warden: 'Отражает часть входящего урона.',
            Vanguard: 'Усиливает давление по ходу боя.',
            Skirmisher: 'Сбалансированный по скорости и урону.',
            Duelist: 'После каждой атаки получает +2 к урону.',
            Breaker: 'Игнорирует броню цели.',
            Ravager: 'Постепенно наращивает атаку.',
            Striker: 'Каждый ход получает +1 к скорости.',
            Blade: '25% шанс нанести двойной урон.',
            Lurker: 'Всегда выбирает цель с наименьшим HP.',
            Marksman: '10% шанс полностью избежать урона.',
            Reaper: 'В начале своего хода добивает ослабленных врагов.',
            Arcanist: '25% шанс провести вторую атаку.',
            Hexer: 'Ослабляет защиту врага (дебафф).',
            Channeler: 'Накладывает урон со временем.',
            Summoner: 'Накладывает запрет на способности.',
            Voidcaster: 'Бьёт по площади.',
            Medic: 'Лечит самого раненого союзника.',
            Enhancer: 'Баффает атаку команды.',
            Protector: 'Даёт защиту от смерти на 1 удар.',
            Oracle: 'Оглушает одну цель.',
            Harmonist: 'Массовый стан по всем врагам.'
        };

        let activeRole = null;

        // === ИНИЦИАЛИЗАЦИЯ ===
        async function init() {
            await loadUserData();
            updateUI();
        }

        async function loadUserData() {
            try {
                const res = await fetch(`/api/user?user_id=${FAKE_USER_ID}`);
                userData = await res.json();
                if (userData.deck) {
                    currentDeck = userData.deck;
                }
            } catch (e) {
                document.getElementById('stats').innerHTML = '❌ Ошибка подключения к серверу';
                console.error(e);
            }
        }

        function updateUI() {
            if (!userData) return;
            
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                🏆 Рейтинг: ${userData.rating}<br>
                ⚔️ Боёв осталось: ${userData.battles_left}<br>
                💰 Баланс: ${userData.ton_balance} TON
            `;

            const battleBtn = document.getElementById('battleBtn');
            battleBtn.disabled = !isDeckComplete(userData.deck) || userData.battles_left <= 0;
        }

        function isDeckComplete(deckObj = currentDeck) {
            const roles = ["Tank", "Fighter", "DPS", "Mage", "Support"];
            return roles.every(role => !!deckObj?.[role]);
        }

        function hidePrimaryActions() {
            const actions = document.getElementById('primaryActions');
            if (actions) actions.style.display = 'none';
            const stats = document.getElementById('stats');
            if (stats) stats.style.display = 'none';
        }

        function showPrimaryActions() {
            const actions = document.getElementById('primaryActions');
            if (actions) actions.style.display = 'block';
            const stats = document.getElementById('stats');
            if (stats) stats.style.display = 'block';
        }

        function skipBattleAnimation() {
            skipBattleRequested = true;
        }

        // === СОБРАТЬ КОЛОДУ ===
        function showDeckBuilder() {
            let html = '<h3>Соберите колоду (1 герой на роль):</h3>';
            for (const role of Object.keys(HEROES_BY_ROLE)) {
                const selected = currentDeck[role];
                html += `
                    <div class="role-block">
                        <div class="role-head">
                            <div>
                                <b>${role}</b><br>
                                <small>${selected ? `Выбран: ${selected}` : 'Герой не выбран'}</small>
                            </div>
                            <button class="btn" onclick="openRolePicker('${role}')">Выбрать ${role}</button>
                        </div>
                    </div>
                `;
            }

            if (activeRole) {
                html += `<h4>Выбор роли: ${activeRole}</h4><div class="pick-grid">`;
                html += HEROES_BY_ROLE[activeRole].map(hero => {
                    const isSelected = currentDeck[activeRole] === hero;
                    const imgSrc = `/images/heroes/${hero}.png`;
                    return `
                        <div class="pick-card ${isSelected ? 'active' : ''}" onclick="selectHero('${activeRole}','${hero}')">
                            <img src="${imgSrc}" alt="${hero}">
                            <div class="meta">
                                <b>${hero}</b><br>
                                <small>${HERO_ABILITIES[hero] || 'Способность скоро будет описана.'}</small>
                            </div>
                        </div>
                    `;
                }).join('');
                html += `</div>`;
            }

            const canSave = isDeckComplete();
            html += `<button class="btn" ${canSave ? '' : 'disabled'} onclick="saveDeck()">💾 Сохранить колоду</button>`;
            document.getElementById('content').innerHTML = html;
            document.getElementById('log').innerHTML = '';
            document.getElementById('battleScene').style.display = 'none';
        }

        function openRolePicker(role) {
            activeRole = role;
            showDeckBuilder();
        }

        function selectHero(role, hero) {
            currentDeck[role] = hero;
            showDeckBuilder();
        }

        async function saveDeck() {
            if (!isDeckComplete()) {
                alert('Выбери героя для каждой роли (Tank, Fighter, DPS, Mage, Support).');
                return;
            }
            try {
                const res = await fetch(`/api/deck?user_id=${FAKE_USER_ID}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({deck: currentDeck})
                });
                if (res.ok) {
                    alert('✅ Колоду сохранена!');
                    await loadUserData();
                    updateUI();
                } else {
                    alert('❌ Ошибка сохранения');
                }
            } catch (e) {
                alert('❌ Не удалось подключиться к серверу');
                console.error(e);
            }
        }

        // === АНИМИРОВАННЫЙ БОЙ ===
        async function startBattle() {
            if (!confirm('Начать бой?')) return;

            if (pendingBattleTimeout) {
                clearTimeout(pendingBattleTimeout);
                pendingBattleTimeout = null;
            }
            skipBattleRequested = false;
            const skipButton = document.getElementById('skipBattleBtn');
            if (skipButton) {
                skipButton.disabled = false;
                skipButton.textContent = '⏩ Пропустить бой';
            }

            document.getElementById('content').style.display = 'none';
            document.getElementById('log').style.display = 'none';
            document.getElementById('battleScene').style.display = 'block';
            hidePrimaryActions();
            document.getElementById('battleLog').textContent = 'Бой начался...';

            try {
                const res = await fetch(`/api/battle?user_id=${FAKE_USER_ID}`, { method: 'POST' });
                const data = await res.json();

                const teamA = data.player_team || Object.values(currentDeck);
                const teamB = data.enemy_team || ["Bulwark", "Vanguard", "Striker", "Arcanist", "Medic"];

                let hpA = {};
                let hpB = {};
                teamA.forEach(name => hpA[name] = (data.player_max_hp && data.player_max_hp[name]) || HERO_STATS[name]);
                teamB.forEach(name => hpB[name] = (data.enemy_max_hp && data.enemy_max_hp[name]) || HERO_STATS[name]);

                renderTeam('teamA', teamA, hpA, true);
                renderTeam('teamB', teamB, hpB, false);

                let eventIndex = 0;
                const events = data.events || [];

                const finishBattle = () => {
                    const result = data.winner ? 
                        `🏆 ПОБЕДА! Новый рейтинг: ${data.new_rating}` : 
                        `💀 ПОРАЖЕНИЕ. Новый рейтинг: ${data.new_rating}`;
                    document.getElementById('battleLog').innerHTML = `<b>${result}</b>`;
                    if (skipButton) {
                        skipButton.disabled = true;
                        skipButton.textContent = '✅ Бой завершён';
                    }

                    pendingBattleTimeout = setTimeout(() => {
                        loadUserData();
                        updateUI();
                        document.getElementById('battleScene').style.display = 'none';
                        document.getElementById('content').style.display = 'block';
                        document.getElementById('log').style.display = 'block';
                        showPrimaryActions();
                    }, 1400);
                };

                const applyEventInstant = (ev) => {
                    if (ev.type === "attack" || ev.type === "dot" || ev.type === "reflect") {
                        if (hpB[ev.target] !== undefined) {
                            hpB[ev.target] = Math.max(0, hpB[ev.target] - ev.damage);
                        } else if (hpA[ev.target] !== undefined) {
                            hpA[ev.target] = Math.max(0, hpA[ev.target] - ev.damage);
                        }
                    } else if (ev.type === "execute") {
                        if (hpB[ev.target] !== undefined) hpB[ev.target] = 0;
                        if (hpA[ev.target] !== undefined) hpA[ev.target] = 0;
                    }
                };

                const processEvent = () => {
                    if (eventIndex >= events.length) {
                        finishBattle();
                        return;
                    }

                    if (skipBattleRequested) {
                        for (let i = eventIndex; i < events.length; i++) {
                            applyEventInstant(events[i]);
                        }
                        renderTeam('teamA', teamA, hpA, true);
                        renderTeam('teamB', teamB, hpB, false);
                        eventIndex = events.length;
                        finishBattle();
                        return;
                    }

                    const ev = events[eventIndex];
                    let logText = '';

                    if (ev.type === "attack") {
                        logText = `${ev.attacker} нанёс ${ev.damage} урона ${ev.target}!`;
                        
                        const isAllyAttacker = teamA.includes(ev.attacker);
                        const isAllyTarget = teamA.includes(ev.target);
                        animateAttack(ev.attacker, ev.target, isAllyAttacker, isAllyTarget);

                        if (hpB[ev.target] !== undefined) {
                            hpB[ev.target] = Math.max(0, hpB[ev.target] - ev.damage);
                            renderTeam('teamB', teamB, hpB, false);
                            showDamagePopup(ev.target, ev.damage, false);
                        } else if (hpA[ev.target] !== undefined) {
                            hpA[ev.target] = Math.max(0, hpA[ev.target] - ev.damage);
                            renderTeam('teamA', teamA, hpA, true);
                            showDamagePopup(ev.target, ev.damage, true);
                        }
                    } 
                    else if (ev.type === "dot") {
                        logText = `${ev.target} получает ${ev.damage} урона от эффекта!`;
                        if (hpB[ev.target] !== undefined) {
                            hpB[ev.target] = Math.max(0, hpB[ev.target] - ev.damage);
                            renderTeam('teamB', teamB, hpB, false);
                            showDamagePopup(ev.target, ev.damage, false);
                        } else if (hpA[ev.target] !== undefined) {
                            hpA[ev.target] = Math.max(0, hpA[ev.target] - ev.damage);
                            renderTeam('teamA', teamA, hpA, true);
                            showDamagePopup(ev.target, ev.damage, true);
                        }
                    }
                    else if (ev.type === "reflect") {
                        logText = `${ev.attacker} отражает ${ev.damage} урона в ${ev.target}!`;
                        if (hpB[ev.target] !== undefined) {
                            hpB[ev.target] = Math.max(0, hpB[ev.target] - ev.damage);
                            renderTeam('teamB', teamB, hpB, false);
                            showDamagePopup(ev.target, ev.damage, false);
                        } else if (hpA[ev.target] !== undefined) {
                            hpA[ev.target] = Math.max(0, hpA[ev.target] - ev.damage);
                            renderTeam('teamA', teamA, hpA, true);
                            showDamagePopup(ev.target, ev.damage, true);
                        }
                    }
                    else if (ev.type === "execute") {
                        logText = `${ev.target} был уничтожен ${ev.attacker ? ev.attacker : 'Reaper'}!`;
                        if (hpB[ev.target] !== undefined) {
                            hpB[ev.target] = 0;
                            renderTeam('teamB', teamB, hpB, false);
                        } else if (hpA[ev.target] !== undefined) {
                            hpA[ev.target] = 0;
                            renderTeam('teamA', teamA, hpA, true);
                        }
                    } else if (ev.type === "skill") {
                        logText = `${ev.hero} использует ${ev.ability}!`;
                        // Каркас под видео-скиллы (пока без обязательного внедрения ассетов)
                        playSkillVideoFx(ev.ability);
                        playSkillFx(ev.hero, teamA.includes(ev.hero), ev.ability);
                        if (Array.isArray(ev.targets)) {
                            ev.targets.forEach(targetName => {
                                const isAllyTarget = teamA.includes(targetName);
                                playSkillFx(targetName, isAllyTarget, ev.ability);
                            });
                        }
                    }

                    document.getElementById('battleLog').textContent = logText;
                    eventIndex++;
                    pendingBattleTimeout = setTimeout(processEvent, 520);
                };

                pendingBattleTimeout = setTimeout(processEvent, 350);

            } catch (e) {
                alert('❌ Ошибка боя');
                console.error(e);
                document.getElementById('battleScene').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('log').style.display = 'block';
                showPrimaryActions();
            }
        }

        function renderTeam(containerId, heroes, hpMap, isAlly) {
            const container = document.getElementById(containerId);
            container.innerHTML = heroes.map(name => {
                const maxHp = HERO_STATS[name] || 100;
                const currentHp = hpMap[name] || 0;
                const percent = Math.max(0, (currentHp / maxHp) * 100);
                const borderColor = isAlly ? '#4CAF50' : '#f44336';
                const cardClass = isAlly ? 'hero-card' : 'hero-card enemy';

                const imgSrc = `/images/heroes/${name}.png`;

                return `
                    <div class="${cardClass}" data-name="${name}" style="border-color:${borderColor}; position:relative;">
                        <img src="${imgSrc}" alt="${name}" 
                             style="width:120%; height:440px; object-fit:cover; border-radius:8px; background:#333; margin-left:-10%;">
                        <div style="font-weight:bold; margin-top:4px; font-size:14px;">${name}</div>
                        <div class="hp-bar">
                            <div class="hp-fill" style="width:${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showDamagePopup(heroName, damage, isAlly) {
            const containerId = isAlly ? 'teamA' : 'teamB';
            const container = document.getElementById(containerId);
            const card = container.querySelector(`[data-name="${heroName}"]`);
            if (!card) return;

            card.style.boxShadow = '0 0 20px #ff0000';
            card.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                card.style.boxShadow = '';
                card.style.transform = '';
            }, 300);

            const popup = document.createElement('div');
            popup.className = 'damage-popup';
            popup.textContent = `-${damage}`;
            card.appendChild(popup);

            setTimeout(() => {
                if (popup.parentNode) popup.parentNode.removeChild(popup);
            }, 1000);
        }

        function animateAttack(attackerName, targetName, isAllyAttacker, isAllyTarget) {
            if (isAnimating) return;
            isAnimating = true;

            const attackerContainer = isAllyAttacker ? 'teamA' : 'teamB';
            const targetContainer = isAllyTarget ? 'teamA' : 'teamB';
            
            const attackerCard = document.querySelector(`#${attackerContainer} [data-name="${attackerName}"]`);
            const targetCard = document.querySelector(`#${targetContainer} [data-name="${targetName}"]`);
            
            if (!attackerCard || !targetCard) {
                isAnimating = false;
                return;
            }

            const imgSrc = attackerCard.querySelector('img').src;
            const clone = document.createElement('img');
            clone.src = imgSrc;
            clone.className = 'attack-clone';
            clone.style.position = 'absolute';
            clone.style.zIndex = '1000';
            clone.style.width = '50px';
            clone.style.height = '50px';
            clone.style.borderRadius = '8px';
            clone.style.pointerEvents = 'none';
            clone.style.opacity = '0.9';
            clone.style.boxShadow = '0 0 10px rgba(255,255,255,0.7)';

            document.body.appendChild(clone);

            const attackerRect = attackerCard.getBoundingClientRect();
            const targetRect = targetCard.getBoundingClientRect();

            const startX = attackerRect.left + window.scrollX + attackerRect.width / 2 - 25;
            const startY = attackerRect.top + window.scrollY + attackerRect.height / 2 - 25;
            const endX = targetRect.left + window.scrollX + targetRect.width / 2 - 25;
            const endY = targetRect.top + window.scrollY + targetRect.height / 2 - 25;

            clone.style.left = `${startX}px`;
            clone.style.top = `${startY}px`;

            const duration = 1000;
            const startTime = performance.now();

            const animate = (currentTime) => {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const currentX = startX + (endX - startX) * progress;
                const currentY = startY + (endY - startY) * progress;
                
                clone.style.left = `${currentX}px`;
                clone.style.top = `${currentY}px`;
                clone.style.opacity = `${0.9 * (1 - progress * 0.5)}`;
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    document.body.removeChild(clone);
                    isAnimating = false;
                }
            };
            
            requestAnimationFrame(animate);
        }

        function playSkillFx(heroName, isAlly, ability) {
            const containerId = isAlly ? 'teamA' : 'teamB';
            const container = document.getElementById(containerId);
            const card = container.querySelector(`[data-name="${heroName}"]`);
            if (!card) return;

            const fx = SKILL_FX[ability] || { color: '#ffffff' };
            card.classList.add('skill-flash');
            card.style.boxShadow = `0 0 16px ${fx.color}`;

            setTimeout(() => {
                card.classList.remove('skill-flash');
                card.style.boxShadow = '';
            }, 600);
        }

        // Каркас: когда будут готовы webm/mp4 клипы скиллов,
        // достаточно включить эту функцию в полноценный режим.
        function playSkillVideoFx(ability) {
            const videoPath = `${ASSET_PATHS.skillVideos}/${ability}.webm`;
            // Временный no-op с логом, чтобы было видно, какой файл ожидается
            console.debug(`Skill video placeholder: ${videoPath}`);
        }

        // === РЕЙТИНГ ===
        async function showRating() {
            try {
                const res = await fetch(`/api/rating`);
                const data = await res.json();
                
                let html = '<h3>🏆 Топ-10 игроков:</h3><ol>';
                data.top.forEach((p, i) => {
                    const isMe = p.user_id === FAKE_USER_ID;
                    html += `<li>${isMe ? '<b>👤 Вы</b>' : `ID: ${p.user_id}`} — ${p.rating} очков</li>`;
                });
                html += '</ol>';
                document.getElementById('content').innerHTML = html;
                document.getElementById('log').innerHTML = '';
                document.getElementById('battleScene').style.display = 'none';
            } catch (e) {
                alert('❌ Не удалось загрузить рейтинг');
            }
        }

        // === МАГАЗИН ===
        function showShop() {
            const html = `
                <h3>💎 Магазин</h3>
                <p>Купить +5 боёв за 1 TON</p>
                <button class="btn" disabled>Купить (пока недоступно)</button>
                <p style="margin-top: 20px;">Косметика:</p>
                <button class="btn" disabled>Рамка профиля — 0.5 TON</button>
                <button class="btn" disabled>Анимация карт — 0.3 TON</button>
            `;
            document.getElementById('content').innerHTML = html;
            document.getElementById('log').innerHTML = '';
            document.getElementById('battleScene').style.display = 'none';
        }

        // Запуск
        init();
    </script>
